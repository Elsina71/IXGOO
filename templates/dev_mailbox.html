{% extends 'base.html' %}
{% block content %}
<h1>{{ t('dev_mailbox') }}</h1>
<p class="muted">{{ t('dev_mailbox_intro') }}</p>
<div class="card" style="padding:8px 0">
{% if mails %}
<table>
  {% for m in mails %}
  <tr><td class="small muted">{{ m.id[:8] }} {{ m.id[9:11] }}:{{ m.id[11:13] }}</td><td>{{ m.to }}</td><td><a href="{{ url_for('dev_mail', mail_id=m.id) }}" target="_blank">{{ m.subject }}</a></td></tr>
  {% endfor %}
</table>
{% else %}<div class="empty">—</div>{% endif %}
</div>
{% endblock %}
