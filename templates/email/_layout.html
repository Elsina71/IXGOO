<!doctype html>
<html lang="{{ lang }}" dir="{{ 'rtl' if rtl else 'ltr' }}">
<body style="margin:0;background:#f6f4ef;font-family:Arial,Helvetica,sans-serif;color:#1a1a1a">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f6f4ef;padding:24px 0"><tr><td align="center">
  <table width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e4e0d7">
    <tr><td style="background:#0b0b0b;padding:18px 24px;border-bottom:3px solid #c9a24a;color:#fff;font-size:22px;font-weight:bold;letter-spacing:.5px">
      IxGoo <span style="color:#c9a24a;font-size:12px;letter-spacing:3px;font-weight:normal">COURIER &amp; LOGISTICS</span>
    </td></tr>
    <tr><td style="padding:26px 24px;font-size:15px;line-height:1.55;text-align:{{ 'right' if rtl else 'left' }}">
      {% block body %}{% endblock %}
    </td></tr>
    <tr><td style="padding:14px 24px;background:#faf8f3;color:#8a857b;font-size:12px;text-align:center">IxGoo Courier &amp; Logistics · More than deliveries</td></tr>
  </table>
</td></tr></table>
</body>
</html>
