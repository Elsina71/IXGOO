{% extends 'base.html' %}
{% block content %}
<div class="narrow card" style="text-align:center">
  <div style="font-size:48px">✉️</div>
  <h1>{{ t('check_email_title') }}</h1>
  <p>{{ t('check_email_text', email=email) }}</p>
  <p class="small muted">{{ t('check_email_spam') }} <a href="{{ url_for('resend_confirmation') }}">{{ t('resend_link') }}</a></p>
  {% if dev_mail %}<p class="small"><a href="{{ url_for('dev_mailbox') }}">{{ t('dev_mailbox') }}</a></p>{% endif %}
</div>
{% endblock %}
